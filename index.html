<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mitgo-verification" content="e42afc6e-94b1-41b6-b32c-7d409293bef4">

<title>Timeless Wardrobe Studio — Quiet-Luxury Outfits, Every Piece Shoppable</title>
<meta name="description" content="Timeless Wardrobe Studio curates complete quiet-luxury outfits for work, off-duty and evening — with styling notes and every piece linked straight to the retailer. Shop the whole look, or just one piece.">
<meta name="theme-color" content="#1B2327">
<meta property="og:site_name" content="Timeless Wardrobe Studio">
<meta property="og:type" content="website">
<meta property="og:title" content="Timeless Wardrobe Studio — Quiet-Luxury Outfits, Every Piece Shoppable">
<meta property="og:description" content="Complete quiet-luxury outfits with styling notes — every piece linked to the retailer. Shop the whole look, or just one piece.">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://timelesswardrobestudio.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap">
<style>
  :root{
    --ink:#1F262A; --bg:#F7F5F2; --paper:#FFFFFF; --accent:#B79A74; --soft:#CBB9A3;
    --dim:#55514A; --muted:#8C877D; --line:#E6E1D8; --tile:#EFECE6;
    --serif:"Playfair Display",Georgia,serif;
    --sans:"Montserrat","Helvetica Neue",Arial,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;
    font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;margin:0}
  img{display:block;max-width:100%}
  a{color:inherit}
  h1,h2,h3{font-family:var(--serif);font-weight:400}
  .wrap{max-width:1080px;margin:0 auto;
    padding-left:max(24px,env(safe-area-inset-left,0px));
    padding-right:max(24px,env(safe-area-inset-right,0px))}
  .eyebrow{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:500}

  /* Header */
  header.site{position:sticky;top:0;z-index:30;background:rgba(247,245,242,.92);
    backdrop-filter:saturate(1.1) blur(10px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
  .brand{font-family:var(--serif);font-weight:500;font-size:18px;letter-spacing:.04em;
    text-decoration:none;color:var(--ink);white-space:nowrap}
  .brand b{font-weight:600}
  .nav nav{display:flex;align-items:center;gap:22px}
  .nav a.link{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
    text-decoration:none;font-weight:500}
  .nav a.link:hover{color:var(--ink)}
  .nav a.link.cta{color:var(--ink);border:1px solid var(--ink);border-radius:40px;padding:8px 16px}
  .nav a.link.cta:hover{background:var(--ink);color:var(--bg)}

  /* Header: menu dropdown + icon actions */
  .nav .nleft{display:flex;align-items:center;gap:22px}
  .nav .nright{display:flex;align-items:center;gap:6px}
  .menu-wrap{position:relative}
  .menu-trig{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--dim);font-weight:500;background:none;border:0;cursor:pointer;font-family:var(--sans);padding:6px 2px}
  .menu-trig:hover,.menu-trig[aria-expanded="true"]{color:var(--ink)}
  .menu-trig .chev{width:9px;height:9px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
    transform:rotate(45deg) translateY(-1px);transition:transform .2s}
  .menu-trig[aria-expanded="true"] .chev{transform:rotate(-135deg) translateY(-1px)}
  .menu-panel{position:absolute;top:calc(100% + 14px);left:0;background:var(--paper);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 18px 50px -24px rgba(31,38,42,.3);padding:22px 26px;display:none;
    grid-template-columns:1fr 1fr;gap:26px 40px;min-width:420px;z-index:60}
  .menu-panel.open{display:grid}
  .menu-col h4{font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin:0 0 12px}
  .menu-col a{display:block;font-size:14px;color:var(--ink);text-decoration:none;padding:6px 0;font-weight:400;
    border-bottom:1px solid transparent;transition:color .15s}
  .menu-col a:hover{color:var(--accent)}
  .icbtn{display:inline-flex;align-items:center;gap:7px;background:none;border:0;cursor:pointer;font-family:var(--sans);
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:500;
    text-decoration:none;padding:8px 10px;border-radius:40px;white-space:nowrap}
  .icbtn:hover{color:var(--ink);background:var(--tile)}
  .icbtn svg{width:17px;height:17px;display:block;flex:0 0 auto}
  .icbtn .lbl{display:inline}
  .icbtn.wish{position:relative}
  .wishcount{position:absolute;top:2px;right:2px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;
    background:var(--ink);color:#fff;font-size:9px;letter-spacing:0;display:none;align-items:center;justify-content:center;font-weight:600}
  .wishcount.show{display:inline-flex}
  .icbtn.acct .lbl{max-width:92px;overflow:hidden;text-overflow:ellipsis}

  /* Heart like button */
  .heart{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.86);border:1px solid var(--line);cursor:pointer;padding:0;transition:transform .12s,background .15s;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .heart:hover{transform:scale(1.08);background:#fff}
  .heart svg{width:18px;height:18px;display:block}
  .heart svg path{fill:none;stroke:var(--ink);stroke-width:1.7;transition:fill .15s,stroke .15s}
  .heart.on svg path{fill:var(--ink);stroke:var(--ink)}
  .heart:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .card{position:relative}
  .card .heart{position:absolute;top:12px;right:12px;z-index:4}
  .item__row .heart{width:30px;height:30px}
  .item__row .heart svg{width:16px;height:16px}

  /* Search overlay */
  .search-ov{position:fixed;inset:0;z-index:80;background:rgba(31,38,42,.34);-webkit-backdrop-filter:blur(3px);
    backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:0 16px}
  .search-ov.open{display:flex}
  .search-box{background:var(--bg);width:min(680px,100%);margin-top:84px;border-radius:12px;border:1px solid var(--line);
    box-shadow:0 30px 80px -30px rgba(31,38,42,.5);overflow:hidden;max-height:76vh;display:flex;flex-direction:column}
  .search-top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .search-top svg{width:19px;height:19px;color:var(--muted);flex:0 0 auto}
  .search-top input{flex:1;border:0;background:none;font-family:var(--sans);font-size:17px;color:var(--ink);outline:none}
  .search-top .esc{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);
    border-radius:5px;padding:4px 8px;cursor:pointer;background:none}
  .search-res{overflow-y:auto;padding:8px 0}
  .search-res a{display:flex;align-items:center;gap:14px;padding:10px 20px;text-decoration:none;color:var(--ink)}
  .search-res a:hover{background:var(--tile)}
  .search-res .sr-img{width:46px;height:58px;object-fit:cover;border-radius:4px;background:var(--tile);flex:0 0 auto}
  .search-res .sr-t{font-size:14px;font-weight:500}
  .search-res .sr-s{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .search-empty{padding:26px 20px;color:var(--muted);font-size:14px}
  .search-hint{padding:8px 20px 16px;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

  /* Auth + account + wishlist pages */
  .auth{max-width:420px;margin:0 auto;padding:56px 0 80px}
  .auth h1{font-size:clamp(28px,5vw,38px);margin:0 0 6px}
  .auth .sub{color:var(--dim);font-weight:300;margin:0 0 30px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:7px}
  .field input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:8px;background:var(--paper);
    font-family:var(--sans);font-size:15px;color:var(--ink);outline:none;transition:border-color .15s}
  .field input:focus{border-color:var(--accent)}
  .consent{display:flex;gap:10px;align-items:flex-start;margin:4px 0 20px;font-size:12.5px;color:var(--dim);line-height:1.5}
  .consent input{margin-top:3px;flex:0 0 auto}
  .consent a{color:var(--accent)}
  .auth .btn.primary{width:100%;text-align:center;border:0;padding:15px 26px}
  .auth-alt{margin-top:22px;font-size:13.5px;color:var(--dim);text-align:center}
  .auth-alt a{color:var(--accent);text-decoration:none;font-weight:500}
  .auth-msg{padding:13px 16px;border-radius:8px;font-size:13.5px;margin-bottom:20px;line-height:1.5}
  .auth-msg.err{background:#fbecea;color:#9a3b2e;border:1px solid #f0cdc6}
  .auth-msg.ok{background:#eef3ec;color:#3f6b43;border:1px solid #cfe0cd}
  .auth-msg.info{background:var(--tile);color:var(--dim);border:1px solid var(--line)}
  .acct-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  .wish-empty{text-align:center;padding:50px 0 70px;color:var(--dim)}
  .wish-empty .big{font-family:var(--serif);font-size:26px;color:var(--ink);margin-bottom:10px}
  .wish-sec h2{font-size:22px;margin:34px 0 18px}

  @media(max-width:860px){
    .menu-panel{min-width:300px;grid-template-columns:1fr;left:auto;right:0}
    .icbtn .lbl{display:none}
    .nav .nleft .link{display:none}
    .nav{gap:8px}
  }

  /* Buttons */
  .btn{display:inline-block;font-family:var(--sans);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    font-weight:500;text-decoration:none;padding:13px 26px;border-radius:40px;transition:all .18s;cursor:pointer}
  .btn.primary{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
  .btn.primary:hover{background:#2c363b}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:var(--bg)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* Hero */
  .hero{text-align:center;padding-block:66px 54px;border-bottom:1px solid var(--line)}
  .hero h1{font-size:clamp(34px,6.4vw,60px);line-height:1.08;letter-spacing:-.01em;
    margin:18px auto 0;max-width:15ch;text-wrap:balance}
  .hero .lede{margin:22px auto 0;max-width:56ch;color:var(--dim);font-weight:300;font-size:16.5px}
  .hero .actions{margin-top:30px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .hero-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;max-width:780px;margin:44px auto 0}
  .hero-strip .hs{display:block;aspect-ratio:3/4;border-radius:6px;overflow:hidden;border:1px solid var(--line);
    background:var(--tile);position:relative}
  .hero-strip .hs img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
  .hero-strip .hs:hover img{transform:scale(1.045)}
  .hero-strip .hs .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 12px 11px;
    background:linear-gradient(to top,rgba(31,38,42,.62),rgba(31,38,42,0));
    color:#fff;font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;text-align:left}
  @media(max-width:560px){.hero-strip{gap:9px;margin-top:34px} .hero-strip .hs .cap{font-size:9px;padding:10px 8px 8px}}

  /* How it works */
  .how{padding-block:56px;border-bottom:1px solid var(--line)}
  .how-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:34px}
  .how-step h3{font-size:21px;margin:0 0 10px;line-height:1.25}
  .how-step .n{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--accent);display:block;margin-bottom:12px}
  .how-step p{margin:0;color:var(--dim);font-weight:300;font-size:14.5px}
  .how-step .rule{width:34px;height:1px;background:var(--accent);margin:0 0 16px}

  /* Section heading */
  .sec{padding-block:52px;border-bottom:1px solid var(--line)}
  .sec:last-of-type{border-bottom:none}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
  .sec-head h2{font-size:clamp(23px,3.6vw,31px);margin:0;letter-spacing:-.01em}
  .sec-head .sec-ht{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .sec-count{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;
    border:1px solid var(--soft);border-radius:999px;padding:3px 11px;background:var(--paper);white-space:nowrap}
  .sec-head .seeall{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink);font-weight:600;text-decoration:none;white-space:nowrap;background:var(--paper);
    border:1px solid var(--soft);border-radius:999px;padding:9px 17px;transition:background .18s,color .18s,border-color .18s}
  .sec-head .seeall .arr{transition:transform .18s}
  .sec-head .seeall:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .sec-head .seeall:hover .arr{transform:translateX(3px)}
  .sec-desc{color:var(--dim);font-weight:300;max-width:60ch;margin:0 0 26px;font-size:15px}
  .morebar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:28px;
    text-decoration:none;color:var(--ink);background:var(--tile);border:1px solid var(--line);border-radius:6px;
    padding:17px 24px;transition:background .18s,border-color .18s}
  .morebar:hover{border-color:var(--accent);background:var(--paper)}
  .morebar .mb-t{font-size:15px;font-weight:500;letter-spacing:.01em}
  .morebar .mb-t b{color:var(--accent);font-weight:700}
  .morebar .mb-cta{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    font-weight:600;color:var(--accent);white-space:nowrap}
  .morebar .mb-cta .arr{transition:transform .18s}
  .morebar:hover .mb-cta .arr{transform:translateX(3px)}

  /* Cards grid */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:30px 24px}
  .card{display:flex;flex-direction:column;text-decoration:none;color:inherit}
  .card__imgwrap{width:100%;aspect-ratio:3/4;background:var(--tile);border-radius:4px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
  .card__img{width:100%;height:100%;object-fit:contain}
  .card__eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
    font-weight:500;margin:14px 0 6px}
  .card__title{font-size:19px;line-height:1.22;margin:0;letter-spacing:-.005em}
  .card__meta{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
  .card:hover .card__imgwrap{border-color:var(--soft)}
  .card:hover .card__title{color:var(--accent)}

  /* Studio / trust band */
  .studio{padding-block:60px;border-bottom:1px solid var(--line)}
  .studio-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
  .studio h2{font-size:clamp(24px,3.8vw,34px);margin:14px 0 0;line-height:1.14;max-width:16ch}
  .studio p{color:var(--dim);font-weight:300;margin:18px 0 0;max-width:52ch}
  .studio .trust{list-style:none;padding:0;margin:0}
  .studio .trust li{padding:18px 0;border-top:1px solid var(--line);display:flex;gap:16px}
  .studio .trust li:last-child{border-bottom:1px solid var(--line)}
  .studio .trust b{font-family:var(--serif);font-weight:500;font-size:17px;display:block;margin-bottom:4px}
  .studio .trust span{font-size:13.5px;color:var(--dim);font-weight:300;line-height:1.55}
  .studio .trust .mk{font-family:var(--serif);font-style:italic;color:var(--accent);font-size:17px;flex:0 0 auto;width:20px}

  /* Look / edit / content pages */
  .page{padding-block:30px 10px;min-height:62vh}
  .crumb{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    text-decoration:none;display:inline-block;margin-bottom:20px}
  .crumb:hover{color:var(--ink)}
  .ptitle-eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:500}
  .ptitle{font-size:clamp(28px,5.4vw,42px);line-height:1.1;margin:12px 0 0;max-width:20ch;letter-spacing:-.01em;text-wrap:balance}
  .pintro{margin:18px 0 0;max-width:58ch;color:var(--dim);font-weight:300;font-size:16px}
  .phero{width:100%;max-height:80vh;aspect-ratio:4/5;object-fit:contain;background:var(--tile);
    border:1px solid var(--line);border-radius:4px;margin:28px 0 0}
  .tags{margin:20px 0 0;display:flex;flex-wrap:wrap;gap:9px;padding:0}
  .tags span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
    border:1px solid var(--line);border-radius:40px;padding:7px 14px}
  .swatches{display:flex;gap:14px;margin-top:22px;flex-wrap:wrap}
  .sw{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .sw i{width:28px;height:28px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}

  /* Shop grid */
  .shop-head{margin:44px 0 22px;display:flex;align-items:baseline;justify-content:space-between;gap:14px}
  .shop-head h2{font-size:24px;margin:0}
  .shop-head .hint{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 22px}
  .item{min-width:0;display:flex;flex-direction:column}
  .item__imgwrap{width:100%;aspect-ratio:3/4;background:var(--tile);border:1px solid var(--line);border-radius:4px;
    overflow:hidden;display:flex;align-items:center;justify-content:center;margin-bottom:14px;
    padding:clamp(14px,7%,26px)}
  .item__img{width:100%;height:100%;object-fit:contain}
  .item__name{font-size:13px;font-weight:400;line-height:1.4;margin:0 0 4px}
  .item__brand{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 7px}
  .item__why{font-size:12px;line-height:1.55;color:var(--dim);font-weight:300;margin:0 0 12px}
  .item__row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .item__price{font-size:13px;font-variant-numeric:tabular-nums}
  .shop{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--bg);
    background:var(--ink);text-decoration:none;padding:9px 16px;border-radius:40px;white-space:nowrap;transition:all .18s}
  .shop:hover{background:var(--accent)}
  .shop:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

  /* Outfit block (edit page) */
  .outfit{border-top:1px solid var(--line);padding-block:38px}
  .outfit__label{font-family:var(--serif);font-weight:500;font-size:20px;margin:0 0 22px;display:flex;align-items:center;gap:14px}
  .outfit__label .bar{flex:1;height:1px;background:var(--line)}

  /* Total */
  .total{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;
    margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
  .total .t{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .total .t b{font-family:var(--serif);color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;font-size:19px;letter-spacing:.02em}
  .total .note{font-size:11px;color:var(--muted);font-weight:300;letter-spacing:0;text-transform:none}

  /* About prose */
  .prose{max-width:62ch}
  .prose p{color:var(--dim);font-weight:300;margin:0 0 18px;font-size:16px}
  .prose h3{font-size:19px;margin:34px 0 10px}
  .prose a.inline{border-bottom:1px solid var(--accent)}

  /* More */
  .more{margin-top:58px;border-top:1px solid var(--line);padding-top:36px}
  .more h2{font-size:24px;margin:0 0 24px}

  /* Footer */
  .disclosure{color:var(--muted);font-size:12px;line-height:1.75;text-align:center;
    font-weight:300;max-width:70ch;margin:0 auto;padding-block:40px 0}
  footer.site{text-align:center;padding-block:30px 60px}
  footer.site .fm{font-family:var(--serif);font-size:20px;letter-spacing:.02em;color:var(--ink);font-weight:500}
  footer.site .sub{margin-top:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  footer.site .fnav{margin-top:18px}
  footer.site .fnav a{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);text-decoration:none;margin:0 12px}
  footer.site .fnav a:hover{color:var(--ink)}

  @media(max-width:860px){
    .cards{grid-template-columns:repeat(2,1fr)}
    .grid{grid-template-columns:repeat(3,1fr)}
    .how-grid{grid-template-columns:1fr;gap:28px}
    .studio-grid{grid-template-columns:1fr;gap:30px}
  }
  @media(max-width:560px){
    .grid{grid-template-columns:repeat(2,1fr);gap:22px 14px}
    .nav nav{gap:14px}
    .nav a.link.cta{display:none}
    .hero{padding-block:46px 40px}
  }
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header class="site"><div class="wrap nav">
  <div class="nleft">
    <a class="brand" href="#/" aria-label="Timeless Wardrobe Studio"><img src="img/tws_monogram.png" alt="Timeless Wardrobe Studio" style="height:30px;width:auto;display:block"></a>
    <div class="menu-wrap">
      <button class="menu-trig" id="menuTrig" aria-expanded="false" aria-haspopup="true">Menu <span class="chev"></span></button>
      <div class="menu-panel" id="menuPanel" role="menu"></div>
    </div>
    <a class="link" href="#/palettes">Palettes</a>
    <a class="link" href="#/about">About</a>
  </div>
  <div class="nright">
    <button class="icbtn" id="searchBtn" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
      <span class="lbl">Search</span></button>
    <a class="icbtn acct" id="acctBtn" href="#/login">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"></circle><path d="M5 21c0-3.9 3.1-7 7-7s7 3.1 7 7"></path></svg>
      <span class="lbl">Log in</span></a>
    <a class="icbtn wish" id="wishBtn" href="#/wishlist" aria-label="Wishlist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20s-7-4.6-9.2-9C1.4 8 2.8 5 5.8 5 8 5 9.3 6.6 12 9c2.7-2.4 4-4 6.2-4 3 0 4.4 3 3 6-2.2 4.4-9.2 9-9.2 9z"></path></svg>
      <span class="lbl">Wishlist</span><span class="wishcount" id="wishCount">0</span></a>
  </div>
</div></header>

<div class="wrap"><main id="app"><p style="padding:70px 0;color:var(--muted)">Loading the edit…</p></main></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="tws-config.js"></script>
<script>
  const REPO="";  /* same-origin: looks.json + edits.json deploy with the site */
  const EUR="€", DASH="—";
  const SOVRN_KEY="d5237a01264355bc2efaabedf5dbf093";
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const localize=u=>{try{return "https://redirect.viglink.com?key="+SOVRN_KEY+"&u="+encodeURIComponent(u)+"&loc="+encodeURIComponent(location.href);}catch(e){return u;}};
  const money=p=>{let t=0;(p||[]).forEach(x=>t+=(parseFloat(String(x.price||"").replace(/[^\d.]/g,""))||0));return t;};
  const cur=p=>{const m=String((p||[]).map(x=>x.price).find(Boolean)||"").trim();return m[0]&&/[^\d]/.test(m[0])?m[0]:EUR;};
  const catSlug=c=>String(c||"").toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  const catsInOrder=()=>{const seen=[],out=[];LOOKS.forEach(l=>{const s=catSlug(l.category);if(!seen.includes(s)){seen.push(s);out.push({slug:s,name:l.category});}});return out;};

  /* Short editorial description per category — helps her choose by occasion/mood. */
  const CAT_INFO={
    "9-to-5-luxe":"Polished tailoring for the desk and beyond — quiet authority that carries from a morning meeting straight into dinner.",
    "off-duty-casual":"Weekend ease that still looks considered — soft knits, relaxed denim and elevated basics for days off and slow mornings.",
    "studio-noir":"Evening dressing, distilled — minimal, polished pieces for dinners, launches and nights that deserve the effort."
  };
  const catDesc=slug=>CAT_INFO[slug]||"";

  let LOOKS=[], EDITS=[];
  const bySlugLook=id=>LOOKS.find(l=>l.id===id);
  const bySlugEdit=s=>EDITS.find(e=>e.slug===s);

  function setMeta(title,desc){document.title=title;let m=document.querySelector('meta[name=description]');if(m)m.content=desc;
    let o=document.querySelector('meta[property="og:title"]');if(o)o.content=title;}

  function imgCard(cls,src,alt){return `<div class="${cls}__imgwrap"><img class="${cls}__img" src="${esc(src)}" alt="${esc(alt)}" loading="lazy"></div>`;}

  const HEART_SVG=`<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.6-9.2-9C1.4 8 2.8 5 5.8 5 8 5 9.3 6.6 12 9c2.7-2.4 4-4 6.2-4 3 0 4.4 3 3 6-2.2 4.4-9.2 9-9.2 9z"></path></svg>`;
  const pkey=p=>"pr-"+String(p.url||p.name||"").toLowerCase().replace(/^https?:\/\//,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,90);
  function heartBtn(type,id,data){
    return `<button class="heart" type="button" data-wtype="${esc(type)}" data-wid="${esc(id)}" data-wpayload="${esc(JSON.stringify(data))}" aria-label="Save to wishlist" aria-pressed="false">${HEART_SVG}</button>`;}

  function pieceItem(p){
    const h=heartBtn("product",pkey(p),{name:p.name,brand:p.brand,price:p.price||"",img:p.img,url:p.url});
    return `<article class="item">
      ${imgCard("item",p.img,p.name)}
      <p class="item__name">${esc(p.name)}</p>
      <p class="item__brand">${esc(p.brand)}</p>
      ${p.why?`<p class="item__why">${esc(p.why)}</p>`:""}
      <div class="item__row"><span class="item__price">${p.price?esc(p.price):""}</span>
      <span style="display:flex;gap:8px;align-items:center">${h}
      <a class="shop" href="${esc(localize(p.url))}" target="_blank" rel="noopener sponsored">Shop</a></span></div>
    </article>`;}

  function shopBlock(pieces){const t=money(pieces),c=cur(pieces);
    return `<div class="grid">${(pieces||[]).map(pieceItem).join("")}</div>
      <div class="total"><span class="t">Complete the look ${DASH} <b>${c}${t.toFixed(0)}</b></span>
      <span class="note">Prices set by each retailer; may vary by country.</span></div>`;}

  function card(href,img,eyebrow,title,meta,extra){return `<a class="card" href="${href}">
      ${imgCard("card",img,title)}${extra||""}
      <p class="card__eyebrow">${esc(eyebrow)}</p><h3 class="card__title">${esc(title)}</h3>
      ${meta?`<p class="card__meta">${esc(meta)}</p>`:""}</a>`;}

  function lookCard(l){
    const h=heartBtn("look",l.id,{name:l.sub||l.n,img:l.thumb||l.hero,category:l.category,href:"#/look/"+l.id});
    return card("#/look/"+l.id, l.thumb||l.hero, l.category, l.sub||l.n, (l.pieces?l.pieces.length+" pieces":""), h);}
  function editMeta(e){var c=(e.lookIds&&e.lookIds.length)||(e.outfits&&e.outfits.length)||0; var u=e.type==='guide'?'way':'look'; return c?c+' '+u+(c===1?'':'s'):'';}

  function viewHome(){
    setMeta("Timeless Wardrobe Studio — Quiet-Luxury Outfits, Every Piece Shoppable",
      "Complete quiet-luxury outfits for work, off-duty and evening, with styling notes. Every piece linked to the retailer — shop the whole look or just one piece.");
    const editCards=EDITS.map(e=>card("#/edit/"+e.slug, e.hero||"",
      e.eyebrow||"The Edit", e.title, editMeta(e))).join("");
    const cats=catsInOrder();
    const catSections=cats.map(c=>{
      const ls=LOOKS.filter(l=>catSlug(l.category)===c.slug);
      const d=catDesc(c.slug);
      const n=ls.length, extra=n-3;
      return `<section class="sec">
        <div class="sec-head">
          <div class="sec-ht"><h2>${esc(c.name)}</h2><span class="sec-count">${n} look${n===1?'':'s'}</span></div>
          <a class="seeall" href="#/c/${c.slug}">See all ${n} look${n===1?'':'s'} <span class="arr">&rarr;</span></a>
        </div>
        ${d?`<p class="sec-desc">${esc(d)}</p>`:""}
        <div class="cards">${ls.slice(0,3).map(lookCard).join("")}</div>
        ${extra>0?`<a class="morebar" href="#/c/${c.slug}">
          <span class="mb-t"><b>+${extra}</b> more look${extra===1?'':'s'} in ${esc(c.name)}</span>
          <span class="mb-cta">See all ${n} <span class="arr">&rarr;</span></span></a>`:""}
      </section>`;
    }).join("");

    return `<section class="hero">
        <div class="eyebrow">Quiet luxury, made shoppable</div>
        <h1>Outfits, already put together.</h1>
        <p class="lede">Timeless Wardrobe Studio curates complete looks for work, off-duty and evening &mdash; then links every piece straight to the retailer. Shop the whole outfit, or just the part you were missing.</p>
        <div class="actions">
          <a class="btn primary" href="#categories">Shop the looks</a>
          <a class="btn ghost" href="#how">How it works</a>
        </div>
        ${(()=>{const feat=["p12","p16","p13"].map(bySlugLook).filter(Boolean);const pick=feat.length?feat:LOOKS.slice(0,3);
          return pick.length?`<div class="hero-strip">${pick.map(l=>`<a class="hs" href="#/c/${catSlug(l.category)}"><img src="${esc(l.hero)}" alt="${esc(l.category)}" loading="lazy"><span class="cap">${esc(l.category)}</span></a>`).join("")}</div>`:"";})()}
      </section>

      <section class="how" id="how">
        <div class="eyebrow">How it works</div>
        <div class="how-grid">
          <div class="how-step"><div class="rule"></div><span class="n">First</span><h3>We put the outfit together</h3><p>Each edit is a complete look, chosen piece by piece in a calm, timeless palette &mdash; nothing loud, nothing disposable. The styling is done for you.</p></div>
          <div class="how-step"><div class="rule"></div><span class="n">Then</span><h3>You see exactly why it works</h3><p>Every look comes with notes on the fabrics, the fit and why the pieces belong together &mdash; so you buy with confidence, not guesswork.</p></div>
          <div class="how-step"><div class="rule"></div><span class="n">Finally</span><h3>You shop the look, or one piece</h3><p>Tap any item to buy it from the retailer. Take the full outfit, or just the coat you've been looking for. No cart, no middleman.</p></div>
        </div>
      </section>

      <div id="categories"></div>
      ${catSections}

      ${EDITS.length?`<section class="sec">
        <div class="sec-head"><h2>Colour Stories</h2><a class="seeall" href="#/palettes">All palettes</a></div>
        <p class="sec-desc">One palette, styled several ways &mdash; the easiest way to build a wardrobe where everything already goes together.</p>
        <div class="cards">${editCards}</div></section>`:""}

      <section class="studio">
        <div class="studio-grid">
          <div>
            <div class="eyebrow">The Studio</div>
            <h2>An independent edit for women who want to look considered, not loud.</h2>
            <p>We're not a shop and we don't hold stock. We curate quiet-luxury outfits &mdash; the kind that read expensive without logos &mdash; and point you to the real pieces at the retailers who carry them. Fewer, better things, chosen to last.</p>
            <p style="margin-top:22px"><a class="btn ghost" href="#/about">More about us</a></p>
          </div>
          <ul class="trust">
            <li><div><b>Every piece is real</b><span>No mock-ups. Each item links to a genuine product you can buy today, at the retailer's own price.</span></div></li>
            <li><div><b>Honest links, no markup</b><span>Some links are affiliate links &mdash; we may earn a small commission, at no extra cost to you. It never changes what you pay.</span></div></li>
            <li><div><b>Chosen to last, not to trend</b><span>Timeless shapes and quality fabrics &mdash; pieces that earn their place and lower your cost per wear.</span></div></li>
          </ul>
        </div>
      </section>`;
  }

  function viewCategory(slug){
    const cat=catsInOrder().find(c=>c.slug===slug);
    const ls=LOOKS.filter(l=>catSlug(l.category)===slug);
    if(!ls.length) return viewMissing();
    const name=cat?cat.name:slug; const d=catDesc(slug);
    setMeta(name+" Outfits — Timeless Wardrobe Studio", "Shop "+name+" looks: complete quiet-luxury outfits with styling notes, every piece linked to the retailer.");
    return `<div class="page"><a class="crumb" href="#/">${DASH} Home</a>
      <div class="ptitle-eyebrow">The Edit</div><h1 class="ptitle">${esc(name)}</h1>
      ${d?`<p class="pintro">${esc(d)}</p>`:""}
      <div class="cards" style="margin-top:34px">${ls.map(lookCard).join("")}</div></div>`;
  }

  function lookMore(exceptId){
    const others=LOOKS.filter(l=>l.id!==exceptId).slice(0,3);
    if(!others.length) return "";
    return `<div class="more"><h2>More to shop</h2>
      <div class="cards">${others.map(lookCard).join("")}</div></div>`;
  }

  function viewLook(id){
    const L=bySlugLook(id); if(!L) return viewMissing();
    setMeta((L.sub||L.category)+" — Timeless Wardrobe Studio", "Shop the look: "+(L.sub||L.category)+". Styling notes and every piece linked to the retailer.");
    const cslug=catSlug(L.category);
    return `<div class="page"><a class="crumb" href="#/c/${cslug}">${DASH} ${esc(L.category)}</a>
      <div class="ptitle-eyebrow">${esc(L.category)}</div>
      <h1 class="ptitle">${esc(L.sub||L.category)}</h1>
      ${L.note?`<p class="pintro">${esc(L.note)}</p>`:""}
      ${L.occasions?`<p class="tags">${L.occasions.map(o=>`<span>${esc(o)}</span>`).join("")}</p>`:""}
      ${L.hero?`<img class="phero" src="${esc(L.hero)}" alt="${esc(L.sub||L.category)}" loading="lazy">`:""}
      <div class="shop-head"><h2>Shop the look</h2><span class="hint">Tap a piece to buy it</span></div>
      ${shopBlock(L.pieces)}
      ${lookMore(L.id)}</div>`;
  }

  function viewEdit(slug){
    const E=bySlugEdit(slug); if(!E) return viewMissing();
    setMeta(E.title+" — Timeless Wardrobe Studio", (E.intro||E.title)+" Shop every piece, linked to the retailer.");
    let body="";
    if(E.outfits&&E.outfits.length){
      body=E.outfits.map(o=>`<section class="outfit">
        <p class="outfit__label">${esc(o.label)}<span class="bar"></span></p>
        ${o.img?`<img class="phero" style="margin:0 0 26px" src="${esc(o.img)}" alt="${esc(o.label)}" loading="lazy">`:""}
        ${shopBlock(o.pieces)}</section>`).join("");
    } else if(E.lookIds&&E.lookIds.length){
      const ls=E.lookIds.map(bySlugLook).filter(Boolean);
      body=`<div class="shop-head" style="margin-top:40px"><h2>The looks</h2></div>
        <div class="cards">${ls.map(lookCard).join("")}</div>`;
    }
    const sw=E.swatches?`<div class="swatches">${E.swatches.map(s=>`<span class="sw"><i style="background:${esc(s.hex)}"></i>${esc(s.name)}</span>`).join("")}</div>`:"";
    return `<div class="page"><a class="crumb" href="#/palettes">${DASH} Colour stories</a>
      <div class="ptitle-eyebrow">${esc(E.eyebrow||"The Edit")}</div>
      <h1 class="ptitle">${esc(E.title)}</h1>
      ${E.intro?`<p class="pintro">${esc(E.intro)}</p>`:""}
      ${sw}
      ${E.hero?`<img class="phero" src="${esc(E.hero)}" alt="${esc(E.title)}" loading="lazy">`:""}
      ${body}</div>`;
  }

  function viewPalettes(){
    setMeta("Colour Stories — Timeless Wardrobe Studio","Shop outfits by colour palette — quiet-luxury seasonal colour stories, every piece linked to the retailer.");
    const pal=EDITS.length?EDITS:[];
    return `<div class="page"><a class="crumb" href="#/">${DASH} Home</a>
      <div class="ptitle-eyebrow">Colour Stories</div><h1 class="ptitle">Shop by palette</h1>
      <p class="pintro">One palette, styled several ways &mdash; so everything you buy already works together.</p>
      <div class="cards" style="margin-top:34px">${pal.map(e=>card("#/edit/"+e.slug,e.hero||"",e.eyebrow||"Palette",e.title,editMeta(e))).join("")}</div></div>`;
  }

  function viewAbout(){
    setMeta("About — Timeless Wardrobe Studio","The story behind Timeless Wardrobe Studio: an independent quiet-luxury style edit, every piece shoppable.");
    return `<div class="page prose"><a class="crumb" href="#/">${DASH} Home</a>
      <div class="ptitle-eyebrow">The Studio</div><h1 class="ptitle">About the studio</h1>
      <p style="margin-top:22px">Timeless Wardrobe Studio is an independent style edit for women who want to look quietly put-together &mdash; without spending their evenings scrolling. We build considered outfits for the desk, the day off and the evening, from timeless, well-made pieces, and link every garment straight to the retailer so you can shop the whole look in a tap.</p>
      <p>Our taste is understated and enduring: neutral palettes, clean lines, fabrics that feel good and last. Pieces that read expensive without a logo in sight. No fast-fashion churn &mdash; just outfits worth keeping, and wearing for years.</p>
      <h3>How we choose</h3>
      <p>Every look starts with one question: would a woman with great taste actually wear this, and keep wearing it? We style complete outfits, then source each piece from retailers we'd shop ourselves &mdash; weighing fabric, cut, versatility and cost per wear, not hype.</p>
      <h3>How the links work</h3>
      <p>Each edit is a real, shoppable outfit. Tap any piece to go to the retailer. Some links are affiliate links, which means we may earn a small commission at no extra cost to you &mdash; it keeps the studio running and never changes the price you pay.</p>
      <h3>A note on our imagery</h3>
      <p>Some of our looks are styled and visualised with the help of AI, always declared as such. Every garment shown is a genuine product you can buy from the retailer linked beside it &mdash; what you see is what you shop.</p>
      <h3>Come say hello</h3>
      <p>New edits land first on <a class="inline" href="https://www.pinterest.com/TimelessWardrobeStudio/" target="_blank" rel="noopener">Pinterest</a> and <a class="inline" href="https://www.instagram.com/timeless.wardrobe.studio/" target="_blank" rel="noopener">Instagram</a>.</p>
      ${lookMore("")}</div>`;
  }

  function viewPrivacy(){
    setMeta("Privacy Policy — Timeless Wardrobe Studio","How Timeless Wardrobe Studio handles data and affiliate links.");
    return `<div class="page prose"><a class="crumb" href="#/">${DASH} Home</a>
      <div class="ptitle-eyebrow">Legal</div><h1 class="ptitle">Privacy Policy</h1>
      <p style="margin-top:22px">Timeless Wardrobe Studio ("we", "us") runs this site as an independent style edit. We keep data collection to a minimum and never sell your personal information.</p>
      <h3>What we collect</h3>
      <p>We don't ask you to create an account or hand over personal details to browse. Like most websites, our hosting and the retailers we link to may record standard technical information such as your IP address, browser type and the pages you view, to keep the site secure and working.</p>
      <h3>Affiliate links & cookies</h3>
      <p>Many of our outbound product links are affiliate links, served through our partner Sovrn Commerce. When you click one, a cookie may be set so the retailer can credit the referral &mdash; this is what lets us earn a small commission at no extra cost to you. You can clear or block cookies in your browser at any time; the site still works without them.</p>
      <h3>Third parties</h3>
      <p>When you follow a link to a retailer, their own privacy policy and terms apply to anything you do on their site, including any purchase. We don't process your payments and never see your card details.</p>
      <h3>Your choices</h3>
      <p>You can browse without sharing personal data, block cookies, or reach us with any question at the channels below.</p>
      <h3>Contact</h3>
      <p>Questions about privacy? Message us on <a class="inline" href="https://www.instagram.com/timeless.wardrobe.studio/" target="_blank" rel="noopener">Instagram</a> or <a class="inline" href="https://www.pinterest.com/TimelessWardrobeStudio/" target="_blank" rel="noopener">Pinterest</a>.</p></div>`;
  }

  function viewTerms(){
    setMeta("Terms of Use — Timeless Wardrobe Studio","Terms for using Timeless Wardrobe Studio.");
    return `<div class="page prose"><a class="crumb" href="#/">${DASH} Home</a>
      <div class="ptitle-eyebrow">Legal</div><h1 class="ptitle">Terms of Use</h1>
      <p style="margin-top:22px">By using Timeless Wardrobe Studio you agree to these terms. If you don't agree, please don't use the site.</p>
      <h3>What this site is</h3>
      <p>We are an independent style edit. We curate outfits and link to products sold by third-party retailers. We are not a shop, we don't hold stock, and we don't sell anything directly. Every purchase is a transaction between you and the retailer, under their terms.</p>
      <h3>Prices & availability</h3>
      <p>Prices, availability and product details are set by each retailer and can change at any time. We take care to keep things accurate, but we can't guarantee a price or that an item is in stock when you click through.</p>
      <h3>Affiliate disclosure</h3>
      <p>Some links are affiliate links. We may earn a small commission when you shop through them, at no extra cost to you. It never changes the price you pay, and it doesn't influence which pieces we choose &mdash; we only feature items we'd recommend regardless.</p>
      <h3>Imagery</h3>
      <p>Some imagery is styled or visualised with the help of AI, always declared as such. Every garment shown is a genuine product available from the retailer linked beside it.</p>
      <h3>Content</h3>
      <p>The text, curation and original imagery on this site are ours. Please don't republish them as your own. Retailer product names and images belong to their respective owners.</p>
      <h3>Changes</h3>
      <p>We may update these terms as the site evolves. Continued use means you accept the current version.</p></div>`;
  }

  function viewMissing(){
    setMeta("Timeless Wardrobe Studio","Shop quiet-luxury outfits, every piece linked to the retailer.");
    return `<div class="page"><div class="ptitle-eyebrow">Not here</div><h1 class="ptitle">This edit isn't here yet.</h1>
      <p class="pintro">It may have moved. Browse the current edits instead &mdash; the full look is always a tap away.</p>
      <p style="margin-top:26px"><a class="btn primary" href="#/">Browse the edits</a></p>${lookMore("")}</div>`;
  }

  function footerHTML(){return `<div class="wrap">
    <p class="disclosure">Timeless Wardrobe Studio is an independent style edit. Some links are affiliate links &mdash; we may earn a small commission when you shop, at no extra cost to you. Prices and availability are set by each retailer and vary by country. Some imagery is styled with AI; every garment is a real product from the retailer linked.</p>
    <footer class="site">
      <div class="fm"><img src="img/tws_lockup.png" alt="Timeless Wardrobe Studio" style="height:92px;width:auto;display:inline-block"></div>
      <div class="sub">Quiet luxury, made shoppable</div>
      <div class="fnav"><a href="#/">Looks</a><a href="#/palettes">Palettes</a><a href="#/about">About</a><a href="#/privacy">Privacy</a><a href="#/terms">Terms</a><a href="https://www.pinterest.com/TimelessWardrobeStudio/" target="_blank" rel="noopener">Pinterest</a><a href="https://www.instagram.com/timeless.wardrobe.studio/" target="_blank" rel="noopener">Instagram</a></div>
    </footer></div>`;}

  function route(){
    const h=(location.hash||"#/").replace(/^#/,"");
    const parts=h.split("/").filter(Boolean);
    let html;
    if(parts[0]==="look") html=viewLook(parts[1]);
    else if(parts[0]==="edit") html=viewEdit(parts[1]);
    else if(parts[0]==="c") html=viewCategory(parts[1]);
    else if(parts[0]==="t") html=viewTheme(parts[1]);
    else if(parts[0]==="palettes") html=viewPalettes();
    else if(parts[0]==="about") html=viewAbout();
    else if(parts[0]==="privacy") html=viewPrivacy();
    else if(parts[0]==="terms") html=viewTerms();
    else if(parts[0]==="login") html=viewLogin();
    else if(parts[0]==="signup") html=viewSignup();
    else if(parts[0]==="account") html=viewAccount();
    else if(parts[0]==="wishlist") html=viewWishlist();
    else html=viewHome();
    document.getElementById("app").innerHTML=html;
    let f=document.getElementById("sitefoot"); if(f) f.innerHTML=footerHTML();
    afterRender();
    const hh=location.hash||"";
    if(hh==="#categories"||hh==="#how"){ const el=document.getElementById(hh.slice(1)); if(el) el.scrollIntoView(); }
    else window.scrollTo(0,0);
  }

  function legacyFix(){
    const raw=(location.hash||"").replace(/^#/,"");
    if(raw && raw.indexOf("/")===-1 && raw!=="how" && raw!=="categories"){
      if(bySlugLook(raw)){ location.replace("#/look/"+raw); return true; }
      if(bySlugEdit(raw)){ location.replace("#/edit/"+raw); return true; }
    }
    return false;
  }

  /* ===================== Accounts, Wishlist, Search, Menu ===================== */
  const CFG=(window.TWS_CONFIG||{}); let SB=null;
  const sbReady=()=>!!SB;
  function initSB(){
    try{
      if(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&window.supabase){
        SB=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
        SB.auth.onAuthStateChange(async()=>{ await AUTH.load(); await WISH.load(); updateHeader(); route(); });
      }
    }catch(e){ SB=null; }
  }

  const AUTH={
    user:null,
    async load(){ if(!sbReady()){ this.user=null; return; } try{ const {data}=await SB.auth.getUser(); this.user=(data&&data.user)||null; }catch(e){ this.user=null; } },
    async signIn(email,pw){ const {data,error}=await SB.auth.signInWithPassword({email,password:pw}); if(error) throw error; this.user=data.user; return data; },
    async signUp(email,pw){ const {data,error}=await SB.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname+"#/account",data:{marketing_consent:true,source:"tws-hub"}}}); if(error) throw error; return data; },
    async signOut(){ try{ await SB.auth.signOut(); }catch(e){} this.user=null; },
    email(){ return (this.user&&this.user.email)||""; }
  };

  const WISH={
    items:[], _k:"tws_wishlist_v1",
    _local(){ try{ return JSON.parse(localStorage.getItem(this._k)||"[]"); }catch(e){ return []; } },
    _save(a){ try{ localStorage.setItem(this._k,JSON.stringify(a)); }catch(e){} },
    has(t,id){ return this.items.some(x=>x.wtype===t&&x.wid===id); },
    count(){ return this.items.length; },
    async load(){
      if(sbReady()&&AUTH.user){ try{ const {data,error}=await SB.from("wishlist").select("item_type,item_id,item_data").eq("user_id",AUTH.user.id);
        if(!error&&data){ this.items=data.map(r=>({wtype:r.item_type,wid:r.item_id,payload:r.item_data||{}})); return; } }catch(e){} }
      this.items=this._local();
    },
    async toggle(t,id,payload){
      const on=this.has(t,id);
      if(on) this.items=this.items.filter(x=>!(x.wtype===t&&x.wid===id));
      else this.items.push({wtype:t,wid:id,payload:payload||{}});
      if(sbReady()&&AUTH.user){ try{
        if(on) await SB.from("wishlist").delete().match({user_id:AUTH.user.id,item_type:t,item_id:id});
        else await SB.from("wishlist").upsert({user_id:AUTH.user.id,item_type:t,item_id:id,item_data:payload||{}},{onConflict:"user_id,item_type,item_id"});
      }catch(e){} } else { this._save(this.items); }
      updateHeader(); return !on;
    },
    async mergeLocalToAccount(){
      if(!(sbReady()&&AUTH.user)) return;
      const local=this._local(); if(!local.length) return;
      try{ await SB.from("wishlist").upsert(local.map(x=>({user_id:AUTH.user.id,item_type:x.wtype,item_id:x.wid,item_data:x.payload||{}})),{onConflict:"user_id,item_type,item_id"}); this._save([]); }catch(e){}
    }
  };

  function updateHeader(){
    const c=document.getElementById("wishCount"); if(c){ const n=WISH.count(); c.textContent=n; c.classList.toggle("show",n>0); }
    const a=document.getElementById("acctBtn"); if(a){ const lbl=a.querySelector(".lbl");
      if(AUTH.user){ a.setAttribute("href","#/account"); if(lbl) lbl.textContent=(AUTH.email().split("@")[0]||"Account"); }
      else { a.setAttribute("href","#/login"); if(lbl) lbl.textContent="Log in"; } }
  }

  function afterRender(){
    document.querySelectorAll(".heart[data-wtype]").forEach(b=>{ const on=WISH.has(b.dataset.wtype,b.dataset.wid); b.classList.toggle("on",on); b.setAttribute("aria-pressed",on?"true":"false"); });
    updateHeader();
    const lf=document.getElementById("loginForm"); if(lf&&!lf._w){ lf._w=1; lf.addEventListener("submit",onLogin); }
    const sf=document.getElementById("signupForm"); if(sf&&!sf._w){ sf._w=1; sf.addEventListener("submit",onSignup); }
    const lo=document.getElementById("logoutBtn"); if(lo&&!lo._w){ lo._w=1; lo.addEventListener("click",onLogout); }
  }

  /* Themes (menu subcategories) */
  const pieceMatch=(l,re)=>(l.pieces||[]).some(p=>re.test(String(p.name||"")));
  const THEMES=[
    {slug:"workwear-office",name:"Workwear & Office",test:l=>catSlug(l.category)==="9-to-5-luxe"},
    {slug:"date-night-evening",name:"Date Night & Evening",test:l=>catSlug(l.category)==="studio-noir"},
    {slug:"weekend-off-duty",name:"Weekend & Off-Duty",test:l=>catSlug(l.category)==="off-duty-casual"},
    {slug:"coats-outerwear",name:"Coats & Outerwear",test:l=>pieceMatch(l,/coat|blazer|jacket|trench/i)},
    {slug:"dresses",name:"Dresses",test:l=>pieceMatch(l,/dress/i)},
    {slug:"capsule-wardrobe",name:"Capsule Wardrobe",test:l=>true}
  ];
  const themeBySlug=s=>THEMES.find(t=>t.slug===s);
  function viewTheme(slug){
    const t=themeBySlug(slug); if(!t) return viewMissing();
    const ls=LOOKS.filter(t.test); if(!ls.length) return viewMissing();
    setMeta(t.name+" — Timeless Wardrobe Studio", t.name+" looks — complete quiet-luxury outfits, every piece linked to the retailer.");
    return `<div class="page"><a class="crumb" href="#/">${DASH} Home</a>
      <div class="ptitle-eyebrow">Theme</div><h1 class="ptitle">${esc(t.name)}</h1>
      <p class="pintro">${ls.length} look${ls.length===1?"":"s"} in this theme.</p>
      <div class="cards" style="margin-top:34px">${ls.map(lookCard).join("")}</div></div>`;
  }

  function buildMenu(){
    const panel=document.getElementById("menuPanel"); if(!panel) return;
    const cats=catsInOrder();
    const catCol=`<div class="menu-col"><h4>Shop by category</h4>${cats.map(c=>`<a href="#/c/${c.slug}" role="menuitem">${esc(c.name)}</a>`).join("")}</div>`;
    const themeCol=`<div class="menu-col"><h4>Shop by theme</h4>${THEMES.map(t=>`<a href="#/t/${t.slug}" role="menuitem">${esc(t.name)}</a>`).join("")}<a href="#/palettes" role="menuitem">Colour Stories</a></div>`;
    panel.innerHTML=catCol+themeCol;
  }
  function wireMenu(){
    const t=document.getElementById("menuTrig"), p=document.getElementById("menuPanel"); if(!t||!p) return;
    t.addEventListener("click",e=>{ e.stopPropagation(); const open=p.classList.toggle("open"); t.setAttribute("aria-expanded",open?"true":"false"); });
    p.addEventListener("click",e=>{ if(e.target.closest("a")){ p.classList.remove("open"); t.setAttribute("aria-expanded","false"); } });
  }

  /* Search */
  function buildSearchOverlay(){
    const ov=document.createElement("div"); ov.className="search-ov"; ov.id="searchOv";
    ov.innerHTML=`<div class="search-box"><div class="search-top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
      <input id="searchInput" type="search" placeholder="Search looks, pieces, colours…" autocomplete="off">
      <button class="esc" id="searchEsc" type="button">Esc</button></div>
      <div class="search-res" id="searchRes"></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector("#searchInput").addEventListener("input",e=>renderSearch(e.target.value));
    ov.querySelector("#searchEsc").addEventListener("click",closeSearch);
    ov.addEventListener("click",e=>{ if(e.target===ov) closeSearch(); });
  }
  function openSearch(){ const ov=document.getElementById("searchOv"); if(!ov) return; ov.classList.add("open"); const i=document.getElementById("searchInput"); if(i){ i.value=""; renderSearch(""); setTimeout(()=>i.focus(),30); } }
  function closeSearch(){ const ov=document.getElementById("searchOv"); if(ov) ov.classList.remove("open"); }
  function searchIndex(q){
    q=String(q||"").trim().toLowerCase(); if(!q) return [];
    const out=[];
    LOOKS.forEach(l=>{ const hay=[l.sub,l.n,l.category,l.note,(l.occasions||[]).join(" "),(l.pieces||[]).map(p=>p.name+" "+p.brand+" "+(p.color||"")).join(" ")].join(" ").toLowerCase();
      if(hay.indexOf(q)>=0) out.push({href:"#/look/"+l.id,img:l.thumb||l.hero,t:l.sub||l.n,s:l.category}); });
    EDITS.forEach(e=>{ const hay=[e.title,e.intro,e.eyebrow].join(" ").toLowerCase(); if(hay.indexOf(q)>=0) out.push({href:"#/edit/"+e.slug,img:e.hero,t:e.title,s:e.eyebrow||"Palette"}); });
    LOOKS.forEach(l=>(l.pieces||[]).forEach(p=>{ if(String(p.name||"").toLowerCase().indexOf(q)>=0) out.push({href:"#/look/"+l.id,img:p.img,t:p.name,s:esc(p.brand)+" · in "+(l.sub||l.category)}); }));
    const seen={},dedup=[]; out.forEach(o=>{ const k=o.href+"|"+o.t; if(!seen[k]){ seen[k]=1; dedup.push(o); } });
    return dedup.slice(0,24);
  }
  function renderSearch(q){
    const res=document.getElementById("searchRes"); if(!res) return;
    if(!String(q).trim()){ res.innerHTML=`<p class="search-hint">Try “black”, “coat”, “evening”, “COS”…</p>`; return; }
    const r=searchIndex(q);
    if(!r.length){ res.innerHTML=`<p class="search-empty">No matches for “${esc(q)}”.</p>`; return; }
    res.innerHTML=r.map(o=>`<a href="${o.href}"><img class="sr-img" src="${esc(o.img||"")}" alt="" loading="lazy"><span><span class="sr-t">${esc(o.t)}</span><br><span class="sr-s">${o.s}</span></span></a>`).join("");
    res.querySelectorAll("a").forEach(a=>a.addEventListener("click",closeSearch));
  }

  /* Auth + wishlist views */
  function authNotice(){ return sbReady()?"":`<div class="auth-msg info">Accounts are activating soon. Your Wishlist already works on this device in the meantime.</div>`; }
  function authMsg(kind,txt){ const m=document.getElementById("authMsg"); if(m) m.innerHTML=`<div class="auth-msg ${kind}">${txt}</div>`; }
  function viewLogin(){
    if(AUTH.user){ location.replace("#/account"); return ""; }
    setMeta("Log in — Timeless Wardrobe Studio","Log in to your Timeless Wardrobe Studio account.");
    return `<div class="auth"><h1>Log in</h1><p class="sub">Welcome back. Your saved looks are waiting.</p>
      ${authNotice()}<div id="authMsg"></div>
      <form id="loginForm" autocomplete="on">
        <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email" placeholder="you@email.com"></div>
        <div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password" placeholder="••••••••"></div>
        <button class="btn primary" type="submit">Log in</button></form>
      <p class="auth-alt">New here? <a href="#/signup">Create an account</a></p></div>`;
  }
  function viewSignup(){
    if(AUTH.user){ location.replace("#/account"); return ""; }
    setMeta("Create account — Timeless Wardrobe Studio","Create a Timeless Wardrobe Studio account to save your favourite looks.");
    return `<div class="auth"><h1>Create account</h1><p class="sub">Save the looks and pieces you love — on any device.</p>
      ${authNotice()}<div id="authMsg"></div>
      <form id="signupForm" autocomplete="on">
        <div class="field"><label>Email</label><input type="email" name="email" required autocomplete="email" placeholder="you@email.com"></div>
        <div class="field"><label>Password</label><input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></div>
        <label class="consent"><input type="checkbox" name="consent" required> I agree to the <a href="#/privacy">Privacy Policy</a> and to receiving occasional style emails. Unsubscribe anytime.</label>
        <button class="btn primary" type="submit">Create account</button></form>
      <p class="auth-alt">Already have an account? <a href="#/login">Log in</a></p></div>`;
  }
  function viewAccount(){
    if(!AUTH.user){ if(sbReady()){ location.replace("#/login"); return ""; }
      return `<div class="auth"><h1>Your account</h1>${authNotice()}<p class="auth-alt"><a href="#/wishlist">View your wishlist</a></p></div>`; }
    setMeta("Your account — Timeless Wardrobe Studio","Your Timeless Wardrobe Studio account.");
    return `<div class="page"><div class="acct-head"><h1 class="ptitle">Your account</h1><button class="btn ghost" id="logoutBtn" type="button">Log out</button></div>
      <p class="pintro">Signed in as <b>${esc(AUTH.email())}</b></p>
      <p style="margin-top:24px"><a class="btn primary" href="#/wishlist">My wishlist (${WISH.count()})</a></p></div>`;
  }
  function viewWishlist(){
    setMeta("Wishlist — Timeless Wardrobe Studio","The looks and pieces you saved.");
    const looks=WISH.items.filter(x=>x.wtype==="look"), prods=WISH.items.filter(x=>x.wtype==="product");
    if(!WISH.items.length){
      const tail=(sbReady()&&AUTH.user)?".":(sbReady()?` — and <a href="#/login" style="color:var(--accent)">log in</a> to keep it on every device.`:" — it stays on this device.");
      return `<div class="page"><h1 class="ptitle">Your wishlist</h1>
        <div class="wish-empty"><div class="big">Nothing saved yet.</div>
        <p>Tap the ♥ on any look or piece to save it here${tail}</p>
        <p style="margin-top:22px"><a class="btn primary" href="#/">Browse the looks</a></p></div></div>`;
    }
    let html=`<div class="page"><div class="acct-head"><h1 class="ptitle">Your wishlist</h1>${AUTH.user?`<a class="btn ghost" href="#/account">Account</a>`:(sbReady()?`<a class="btn ghost" href="#/login">Log in to sync</a>`:"")}</div>`;
    if(looks.length){ html+=`<div class="wish-sec"><h2>Saved looks</h2><div class="cards">${looks.map(x=>{const l=bySlugLook(x.wid); if(l) return lookCard(l); const d=x.payload||{}; return card(d.href||("#/look/"+x.wid),d.img||"",d.category||"Look",d.name||"Saved look","",heartBtn("look",x.wid,d));}).join("")}</div></div>`; }
    if(prods.length){ html+=`<div class="wish-sec"><h2>Saved pieces</h2><div class="grid">${prods.map(x=>{const p=x.payload||{}; return pieceItem({name:p.name,brand:p.brand,price:p.price,img:p.img,url:p.url,why:""});}).join("")}</div></div>`; }
    return html+`</div>`;
  }

  async function onLogin(e){ e.preventDefault();
    if(!sbReady()){ authMsg("info","Accounts aren’t live yet — check back soon."); return; }
    const f=e.target; authMsg("info","Signing you in…");
    try{ await AUTH.signIn(f.email.value.trim(),f.password.value); await WISH.mergeLocalToAccount(); await WISH.load(); location.hash="#/"; }
    catch(err){ authMsg("err",(err&&err.message)||"Couldn’t sign in."); }
  }
  async function onSignup(e){ e.preventDefault();
    const f=e.target;
    if(!f.consent.checked){ authMsg("err","Please accept the Privacy Policy to continue."); return; }
    if(!sbReady()){ authMsg("info","Accounts aren’t live yet — check back soon. Your wishlist already works on this device."); return; }
    authMsg("info","Creating your account…");
    try{ await AUTH.signUp(f.email.value.trim(),f.password.value);
      authMsg("ok","Almost there — we’ve sent a confirmation link to <b>"+esc(f.email.value.trim())+"</b>. Click it to verify your account, then log in."); f.reset();
    }catch(err){ authMsg("err",(err&&err.message)||"Couldn’t create the account."); }
  }
  async function onLogout(){ await AUTH.signOut(); await WISH.load(); location.hash="#/"; }

  /* Global click: heart toggle + close menu on outside click */
  document.addEventListener("click",async e=>{
    const h=e.target.closest(".heart[data-wtype]");
    if(h){ e.preventDefault(); e.stopPropagation();
      let payload={}; try{ payload=JSON.parse(h.dataset.wpayload||"{}"); }catch(_){}
      const now=await WISH.toggle(h.dataset.wtype,h.dataset.wid,payload);
      document.querySelectorAll(".heart[data-wtype]").forEach(x=>{ if(x.dataset.wtype===h.dataset.wtype&&x.dataset.wid===h.dataset.wid){ x.classList.toggle("on",now); x.setAttribute("aria-pressed",now?"true":"false"); } });
      if((location.hash||"").indexOf("#/wishlist")===0) route();
      return;
    }
    const mp=document.getElementById("menuPanel"), mt=document.getElementById("menuTrig");
    if(mp&&mp.classList.contains("open")&&!e.target.closest(".menu-wrap")){ mp.classList.remove("open"); if(mt) mt.setAttribute("aria-expanded","false"); }
  });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSearch(); });

  async function getJSON(name,fallback){
    try{const r=await fetch(REPO+name+"?t="+Date.now(),{cache:"no-store"});if(r.ok){const d=await r.json();if(Array.isArray(d))return d;}}catch(e){}
    return fallback;
  }
  async function boot(){
    LOOKS=await getJSON("looks.json",[]);
    EDITS=await getJSON("edits.json",[]);
    if(!document.getElementById("sitefoot")){
      const f=document.createElement("div"); f.id="sitefoot"; document.body.appendChild(f);
    }
    initSB();
    await AUTH.load();
    await WISH.load();
    buildMenu(); wireMenu(); buildSearchOverlay();
    const sb=document.getElementById("searchBtn"); if(sb) sb.addEventListener("click",openSearch);
    window.addEventListener("hashchange",()=>{ if(!legacyFix()) route(); });
    if(!legacyFix()) route();
  }
  boot();
</script>
</body>
</html>
